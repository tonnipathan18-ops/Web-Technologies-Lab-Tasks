<!DOCTYPE html>
<html lang="en">
<head>
    <title>Library Membership Form</title>
    <!-- File-er nam er sathe hohubhu match kora holo -->
    <link rel="stylesheet" href="library management form.css">
</head>
<body>

    <h1>Library Membership Form</h1>

    <form>
        <div>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required>
        </div><br>
        
        <div>
            <label for="age">Age:</label><br>
            <input type="number" id="age" required>
        </div><br>
        
        <div>
            <label for="email">Email:</label><br>
            <input type="email" id="email" required>
        </div><br>
        
        <div>
            <label for="phone">Phone:</label><br>
            <input type="tel" id="phone" required>
        </div><br>
        
        <div>
            <label>Membership Plan:</label><br>
            <input type="radio" name="membership" value="basic" checked>basic 
            <input type="radio" name="membership" value="silver">silver
            <input type="radio" name="membership" value="gold">gold
        </div><br>
        
        <input type="submit" value="Submit">
    </form>

    <hr>
    <div id="output"></div>

    <!-- File-er nam er sathe hohubhu match kora holo -->
    <script src="library management form.js"></script>
</body>
</html>
